<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pivotal Epic Pane Design</title>
<style>
:root{--ink:#24272b;--muted:#6d737b;--line:#d6d9dd;--page:#f1f3f4;--surface:#fff;--blue:#226b9d;--teal:#1d8279;--amber:#bd761b;--green:#347b4c;--purple:#7654a0;--red:#c65d3f}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{height:30px;padding:0 8px;border:1px solid var(--line);border-radius:5px;background:#fff;color:inherit;font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:auto minmax(220px,360px) minmax(150px,220px) 1fr auto;align-items:center;gap:9px;min-height:50px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}.brand{font-size:17px;font-weight:800}.nav{display:flex;gap:4px;align-items:center}.nav button.active{background:#30343a;color:#fff}.sync{color:var(--green);font-weight:700}.board{display:flex;align-items:flex-start;gap:8px;padding:10px;overflow-x:auto;scroll-behavior:smooth;scroll-snap-type:x proximity}.pane{width:300px;min-width:300px;max-width:300px;min-height:620px;background:#f8f9fa;border:1px solid var(--line);border-radius:7px;overflow:hidden;scroll-snap-align:start}.pane-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;padding:8px 10px;background:#30343a;color:#fff}.pane-head strong{overflow-wrap:anywhere}.head-actions{display:flex;align-items:center;gap:5px}.count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#ffffff1f}.close{width:24px;min-width:24px;height:24px;min-height:24px;padding:0;border-color:#ffffff2b;background:#ffffff14;color:#fff;border-radius:50%}.quick{display:grid;grid-template-columns:1fr auto;gap:5px;padding:7px;border-bottom:1px solid var(--line)}.quick input{width:100%;border-style:dashed}.quick button{background:var(--blue);border-color:var(--blue);color:#fff}.story-list,.epic-list{display:grid}.story,.epic-row{position:relative;display:grid;grid-template-columns:3px minmax(0,1fr) auto;gap:7px;min-height:50px;padding:8px 7px;background:#fff;border-bottom:1px solid #e5e7ea}.story:hover,.epic-row:hover{background:#f8fbfd}.epic-row{grid-template-columns:10px minmax(0,1fr) auto;cursor:pointer}.epic-row.active{background:#edf5fa;box-shadow:inset 3px 0 var(--blue)}.epic-dot{width:9px;height:9px;margin-top:3px;border-radius:50%;background:var(--purple)}.epic-title,.story-title{font-weight:700;line-height:1.3;overflow-wrap:anywhere}.epic-desc{margin-top:3px;color:var(--muted);line-height:1.35}.signal{border-radius:2px;background:var(--blue)}.story[data-status="Doing"] .signal{background:var(--amber)}.story[data-status="Done"] .signal{background:var(--green)}.story-meta{display:flex;gap:5px;margin-top:4px;color:var(--muted);font-size:10px}.epic-tag{color:var(--teal)}.story-menu{width:25px;height:24px;padding:0;color:var(--muted)}.summary{padding:10px;background:#fff;border-bottom:1px solid var(--line)}.summary-title{font-weight:700;line-height:1.35}.summary-desc{margin-top:4px;color:var(--muted);line-height:1.4}.progress{height:6px;margin-top:9px;overflow:hidden;border-radius:4px;background:#e4e7ea}.progress span{display:block;height:100%;background:var(--green)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}.metric{padding:7px;background:#fff;text-align:center}.metric strong{display:block;font-size:15px}.metric span{color:var(--muted);font-size:10px}.filters{display:grid;grid-template-columns:repeat(3,1fr);padding:6px;background:#f8f9fa;border-bottom:1px solid var(--line)}.filters button{border-radius:0}.filters button:first-child{border-radius:5px 0 0 5px}.filters button:last-child{border-radius:0 5px 5px 0}.filters button.active{background:#30343a;color:#fff}.group-label{padding:7px 8px;background:#f1f3f5;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;border-bottom:1px solid var(--line)}.placeholder{display:grid;place-items:center;height:520px;color:var(--muted)}.lane-ghost .story{opacity:.85}@media(max-width:720px){header{grid-template-columns:1fr}.nav{overflow-x:auto}.pane{width:calc(100vw - 28px);min-width:calc(100vw - 28px);max-width:calc(100vw - 28px)}}
body{overflow:hidden}.board{align-items:stretch;height:calc(100vh - 50px);overflow-y:hidden}.pane{height:100%;min-height:0;overflow-y:auto}.pane-head{position:sticky;top:0;z-index:2}@media(max-width:720px){.board{height:calc(100vh - 145px)}}
</style></head><body>
<header><strong class="brand">Pivotal</strong><input placeholder="Search stories"><select><option>All epics</option><option>#sessions</option><option>#portfolio</option></select><nav class="nav"><button class="active">Epics</button><button>Icebox</button><button>Todo</button><button>Doing</button><button>Done</button></nav><span class="sync">Prototype</span></header>
<main id="board" class="board"><section class="pane"><div class="pane-head"><strong>Epics</strong><span class="count">4</span></div><div id="epic-list" class="epic-list"></div></section><section id="epic-slot"></section><section class="pane lane-ghost"><div class="pane-head"><strong>Icebox</strong><span class="count">2</span></div><div class="quick"><input placeholder="+ Add story"><button>+</button></div><div class="story-list"><article class="story"><i class="signal"></i><div><div class="story-title">Automatic session summaries</div><div class="story-meta"><span class="epic-tag">#automation</span></div></div><button class="story-menu">...</button></article><article class="story"><i class="signal"></i><div><div class="story-title">Portfolio management and grouping</div><div class="story-meta"><span class="epic-tag">#portfolio</span></div></div><button class="story-menu">...</button></article></div></section><section class="pane lane-ghost"><div class="pane-head"><strong>Todo</strong><span class="count">1</span></div><div class="quick"><input placeholder="+ Add story"><button>+</button></div><div class="story-list"><article class="story"><i class="signal"></i><div><div class="story-title">Plan the session launch workflow</div><div class="story-meta"><span class="epic-tag">#sessions</span><span>1 note</span></div></div><button class="story-menu">...</button></article></div></section></main>
<script>
const epics=[
 {id:'phase_3_story_history_foundation',name:'#phase_3_story_history_foundation',color:'#2f8c7c',description:'Story notes, history events, and lightweight session state.',stories:[
  {title:'Add durable story-session storage helpers',status:'Done',notes:1},
  {title:'Expose read and append endpoints for story notes',status:'Done',notes:2},
  {title:'Add board-side inline notes threads',status:'Done',notes:1},
  {title:'Cover storage, API, and browser behavior',status:'Done',notes:0},
  {title:'Add transcript lookup by session ID',status:'Todo',notes:0}]},
 {id:'kanban_card_reordering',name:'#kanban_card_reordering',color:'#af52de',description:'Story-card ordering within and across board lanes.',stories:[
  {title:'Move cards within a lane',status:'Done',notes:0},{title:'Move cards across lanes',status:'Done',notes:1},{title:'Persist local rank state',status:'Done',notes:0}]},
 {id:'phase_2_epic_support',name:'#phase_2_epic_support',color:'#ff5733',description:'Board-level epic metadata, filters, and detail panes.',stories:[
  {title:'Parse epic metadata from epics.md',status:'Done',notes:0},{title:'Show epic chips and filters',status:'Done',notes:1},{title:'Open useful epic story panes',status:'Done',notes:0}]},
 {id:'sessions',name:'#sessions',color:'#2678a5',description:'Launch, discover, and manage development sessions.',stories:[
  {title:'Plan the session launch workflow',status:'Todo',notes:1},{title:'Discover live Terminal sessions',status:'Icebox',notes:2},{title:'Design session lifecycle controls',status:'Doing',notes:3}]}
];
let activeEpic='phase_3_story_history_foundation';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function renderEpics(){document.querySelector('#epic-list').innerHTML=epics.map(e=>`<article class="epic-row ${e.id===activeEpic?'active':''}" data-epic="${e.id}"><i class="epic-dot" style="background:${e.color}"></i><div><div class="epic-title">${esc(e.name)}</div><div class="epic-desc">${esc(e.description)}</div></div><strong>${e.stories.length}</strong></article>`).join('')}
function storyRow(epic,story){return `<article class="story" data-status="${story.status}"><i class="signal"></i><div><div class="story-title">${esc(story.title)}</div><div class="story-meta"><span>${story.status}</span><span>${story.notes} note${story.notes===1?'':'s'}</span><span class="epic-tag">${esc(epic.name)}</span></div></div><button class="story-menu">...</button></article>`}
function renderPane(shouldFocus){const slot=document.querySelector('#epic-slot');if(!activeEpic){slot.innerHTML='';return}const epic=epics.find(e=>e.id===activeEpic),done=epic.stories.filter(s=>s.status==='Done'),open=epic.stories.filter(s=>s.status!=='Done'),pct=Math.round(done.length/epic.stories.length*100);slot.innerHTML=`<section id="open-epic-pane" class="pane"><div class="pane-head" style="box-shadow:inset 4px 0 ${epic.color}"><strong>${esc(epic.name)}</strong><span class="head-actions"><span class="count">${epic.stories.length}</span><button class="close" data-action="close">x</button></span></div><div class="summary"><div class="summary-title">${esc(epic.name.replace(/^#/,'').replaceAll('_',' '))}</div><div class="summary-desc">${esc(epic.description)}</div><div class="progress"><span style="width:${pct}%"></span></div></div><div class="metrics"><div class="metric"><strong>${open.length}</strong><span>Open</span></div><div class="metric"><strong>${done.length}</strong><span>Done</span></div><div class="metric"><strong>${pct}%</strong><span>Complete</span></div></div><div class="quick"><input placeholder="+ Add story to ${esc(epic.name)}"><button>+</button></div>${open.length?`<div class="group-label">Open stories</div><div class="story-list">${open.map(s=>storyRow(epic,s)).join('')}</div>`:''}${done.length?`<div class="group-label">Completed stories</div><div class="story-list">${done.map(s=>storyRow(epic,s)).join('')}</div>`:''}${!epic.stories.length?'<div class="placeholder">No stories in this epic</div>':''}</section>`;if(shouldFocus){const pane=document.querySelector('#open-epic-pane');document.querySelector('#board').scrollTo({left:pane.offsetLeft-10,behavior:'smooth'})}}
document.addEventListener('click',e=>{const epic=e.target.closest('[data-epic]');if(epic){activeEpic=epic.dataset.epic;renderEpics();renderPane(true);return}if(e.target.dataset.action==='close'){activeEpic=null;renderEpics();renderPane(false)}});
renderEpics();renderPane(false);
</script></body></html>
