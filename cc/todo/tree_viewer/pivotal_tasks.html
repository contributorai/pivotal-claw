<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pivotal</title>
  <!-- Load Premium Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Curated HSL Light Palette */
      --hue-blue: 215;
      --hue-orange: 35;
      --hue-green: 142;
      --hue-purple: 271;
      --hue-slate: 218;

      --blue: hsl(var(--hue-blue), 90%, 55%);
      --orange: hsl(var(--hue-orange), 95%, 50%);
      --green: hsl(var(--hue-green), 76%, 40%);
      --purple: hsl(var(--hue-purple), 76%, 58%);
      --red: hsl(0, 84%, 60%);
      
      --page-bg: #f4f6fa;
      --card-bg: #ffffff;
      --pane-bg: #eaecf2;
      --ink: #1e293b;
      --muted: #64748b;
      --line: #cbd5e1;
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 32px;
      --space-half: 4px;
      --border-radius-card: 2px;
      --border-radius-pane: 14px;

      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.02);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.03);

      --transition-fast: 0.15s ease;
      --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);

      /* Theme-swappable surface tokens (dark overrides below) */
      --strong-bg: var(--ink);
      --header-bg: rgba(255, 255, 255, 0.85);
      --surface-hover: #f8fafc;
      --surface-subtle: #f1f5f9;
      --surface-alt: #fafbfe;
      --tag-autocomplete-bg: #ffffff;
      --code-text: #0f172a;
      --track-bg: #e2e8f0;
      --border-soft: rgba(226, 232, 240, 0.8);
      --border-soft-90: rgba(226, 232, 240, 0.9);
      --border-soft-50: rgba(226, 232, 240, 0.5);
      --btn-hover-border: #94a3b8;
      --task-hover-border: rgba(203, 213, 225, 0.8);
      --nav-pressed-hover-bg: #334155;
      --quick-add-overlay: rgba(255,255,255,0.5);
      --scrollbar-track: rgba(0,0,0,0.03);
      --scrollbar-thumb: rgba(0,0,0,0.15);
      --scrollbar-thumb-hover: rgba(0,0,0,0.25);
      --status-ok-bg: #f0fdf4;
      --status-ok-border: #bbf7d0;
      --status-busy-bg: #eff6ff;
      --status-busy-border: #bfdbfe;
      --status-err-bg: #fef2f2;
      --status-err-border: #fca5a5;

      --card-doing-bg: hsl(215 85% 96%);
      --card-done-bg: hsl(142 50% 96%);
      --focus-ring: #d97706;
      --gap-bg: rgba(37, 99, 235, 0.07);
      --gap-line: rgba(37, 99, 235, 0.45);
      --saved-wash: rgba(22, 163, 74, 0.16);
    }

    /* Dark mode palette, sourced from portfolio/prototype-1-focus-groups.html */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page-bg: #16181d;
      --card-bg: #20242c;
      --pane-bg: #1c1f26;
      --ink: #e7e9ee;
      --muted: #8b909c;
      --line: #2a2e37;

      --blue: hsl(var(--hue-blue), 90%, 64%);
      --orange: hsl(var(--hue-orange), 95%, 58%);
      --green: hsl(var(--hue-green), 55%, 55%);
      --purple: hsl(var(--hue-purple), 76%, 68%);
      --red: hsl(0, 84%, 66%);

      --strong-bg: #0d0f13;
      --header-bg: rgba(22, 24, 29, 0.85);
      --surface-hover: #262b34;
      --surface-subtle: #20242c;
      --surface-alt: #191c22;
      --tag-autocomplete-bg: #20242c;
      --code-text: #e7e9ee;
      --track-bg: #2c313b;
      --border-soft: rgba(255,255,255,0.08);
      --border-soft-90: rgba(255,255,255,0.10);
      --border-soft-50: rgba(255,255,255,0.06);
      --btn-hover-border: #4b5563;
      --task-hover-border: rgba(255,255,255,0.14);
      --nav-pressed-hover-bg: #363c47;
      --quick-add-overlay: rgba(255,255,255,0.04);
      --scrollbar-track: rgba(255,255,255,0.04);
      --scrollbar-thumb: rgba(255,255,255,0.14);
      --scrollbar-thumb-hover: rgba(255,255,255,0.22);
      --status-ok-bg: rgba(52, 199, 89, 0.14);
      --status-ok-border: rgba(52, 199, 89, 0.35);
      --status-busy-bg: rgba(77, 163, 255, 0.14);
      --status-busy-border: rgba(77, 163, 255, 0.35);
      --status-err-bg: rgba(255, 82, 82, 0.14);
      --status-err-border: rgba(255, 82, 82, 0.35);

      --card-doing-bg: #1d3b53;
      --card-done-bg: #1e4620;
      --focus-ring: #f39c12;
      --gap-bg: rgba(91, 141, 239, 0.10);
      --gap-line: rgba(91, 141, 239, 0.55);
      --saved-wash: rgba(52, 199, 89, 0.20);
    }

    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: grid;
      grid-template-columns: auto minmax(180px, 360px) minmax(150px, 220px) minmax(150px, 220px) 1fr auto auto auto;
      gap: 16px;
      align-items: center;
      padding: 12px 20px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border-soft);
      backdrop-filter: blur(12px);
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    
    .logo {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 22px;
      background: linear-gradient(135deg, var(--blue) 0%, var(--purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    
    input[type="search"], select {
      font-family: inherit;
      font-size: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--ink);
      height: 36px;
      padding: 0 12px;
      outline: none;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }
    
    input[type="search"]:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    #portfolio-filter-wrap { display: flex; min-width: 0; }

    #portfolio-filter { flex: 1 1 auto; min-width: 0; }

    /* An active scope has to be obvious without costing header space. */
    #portfolio-filter.scoped {
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.12);
      font-weight: 600;
    }

    button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      height: 34px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all var(--transition-fast);
    }
    
    button:hover {
      background: var(--surface-hover);
      border-color: var(--btn-hover-border);
    }
    
    button.primary {
      background: var(--blue);
      color: #ffffff;
      border-color: var(--blue);
    }
    
    button.primary:hover {
      background: hsl(var(--hue-blue), 90%, 48%);
      border-color: hsl(var(--hue-blue), 90%, 48%);
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.25);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    nav, .toolbar, #status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    nav button {
      background: var(--surface-subtle);
      border-color: transparent;
      color: var(--muted);
      font-weight: 600;
      padding: 0 12px;
      height: 32px;
    }
    
    nav button[aria-pressed="true"] {
      background: var(--strong-bg);
      color: #ffffff;
    }

    nav button[aria-pressed="true"]:hover {
      background: var(--nav-pressed-hover-bg);
    }
    
    #status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    #status-bar > span {
      padding: 6px 12px;
      border-radius: 20px;
      background: var(--status-ok-bg);
      border: 1px solid var(--status-ok-border);
      font-weight: 600;
      color: var(--green);
      font-size: 12px;
      white-space: nowrap;
    }

    #status-bar[data-state="busy"] > span {
      background: var(--status-busy-bg);
      border-color: var(--status-busy-border);
      color: var(--blue);
    }

    #status-bar[data-state="error"] > span {
      background: var(--status-err-bg);
      border-color: var(--status-err-border);
      color: var(--red);
    }
    
    main {
      padding-bottom: 24px;
    }
    
    .panes {
      display: flex;
      gap: var(--space-2);
      overflow-x: auto;
      padding: var(--space-2);
      align-items: flex-start;
      height: calc(100vh - 75px);
    }
    
    /* Scrollbar styling */
    .panes::-webkit-scrollbar {
      height: 10px;
    }
    .panes::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
      border-radius: 10px;
    }
    .panes::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 10px;
    }
    .panes::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-thumb-hover);
    }
    
    .pane {
      min-width: 290px;
      width: min(330px, 86vw);
      max-width: 330px;
      flex: 0 0 auto;
      background: var(--pane-bg);
      border: 1px solid var(--border-soft);
      border-radius: var(--border-radius-pane);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      max-height: 100%;
    }
    
    .pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: var(--space-1) var(--space-2);
      background: var(--strong-bg);
      color: #ffffff;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    
    .pane-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 15px;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    
    .pane-header-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    
    .pane-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      min-width: 22px;
      height: 22px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.8);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .pane-close:hover {
      background: rgba(255,255,255,0.25);
      color: #ffffff;
    }
    
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
    }
    
    .quick-add {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: var(--space-1);
      background: var(--quick-add-overlay);
      border-bottom: 1px solid var(--border-soft);
    }

    .quick-add input {
      border: 1px dashed var(--line);
      background: var(--card-bg);
      height: 32px;
      border-radius: 6px;
      padding: 0 10px;
      font-size: 12px;
    }
    
    .quick-add input:focus {
      border-style: solid;
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
    }
    
    .quick-add button {
      min-height: 32px;
      height: 32px;
      width: 32px;
      padding: 0;
      border-radius: 6px;
    }

    .epic-new-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: var(--space-1);
      background: var(--quick-add-overlay);
      border: none;
      border-bottom: 1px solid var(--border-soft);
      color: var(--blue);
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
    }

    .epic-composer {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: var(--space-1);
      background: var(--quick-add-overlay);
      border-bottom: 1px solid var(--border-soft);
    }

    .epic-composer input,
    .epic-composer select {
      border: 1px dashed var(--line);
      background: var(--card-bg);
      color: var(--ink);
      height: 30px;
      border-radius: 6px;
      padding: 0 8px;
      font-size: 12px;
    }

    .epic-composer input:focus,
    .epic-composer select:focus {
      border-style: solid;
      border-color: var(--blue);
    }

    .epic-composer-actions {
      display: flex;
      gap: 6px;
    }

    .epic-composer-actions button {
      height: 28px;
      padding: 0 10px;
      border-radius: 6px;
      font-size: 12px;
    }

    .epic-composer-error {
      color: var(--red);
      font-size: 11px;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-half);
      padding: var(--space-1);
      overflow-y: auto;
      flex: 1 1 auto;
      min-height: 100px;
    }
    
    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--border-soft-90);
      border-left: 4px solid var(--muted);
      border-radius: var(--border-radius-card);
      padding: 0;
      transition: box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
      position: relative;
      cursor: grab;
    }
    
    .task-card:hover {
      border-color: var(--task-hover-border);
    }
    
    .task-card.selected {
      background: var(--surface-hover);
      border-color: var(--focus-ring);
      box-shadow: 0 0 0 1px var(--focus-ring);
    }

    /* Pointer-drag states: the lifted card rides the cursor while a gap
       placeholder marks where it will land. */
    body.dragging-now {
      user-select: none;
      cursor: grabbing;
    }

    .task-card.lifted {
      position: fixed;
      z-index: 50;
      margin: 0;
      pointer-events: none;
      box-shadow: 0 12px 28px rgba(0,0,0,0.22), 0 3px 8px rgba(0,0,0,0.14);
      will-change: transform;
    }

    .gap {
      border-radius: var(--border-radius-card);
      background: var(--gap-bg);
      border: 1px dashed var(--gap-line);
      flex: 0 0 auto;
    }

    /* Dropping a story here assigns the epic rather than inserting a row. */
    .epic-row.epic-drop-hover {
      background: var(--gap-bg);
      box-shadow: 0 0 0 2px var(--focus-ring);
    }

    @keyframes settle {
      0% { box-shadow: 0 0 0 2px var(--gap-line); }
      100% { box-shadow: 0 0 0 2px transparent; }
    }

    .task-card.settled {
      animation: settle 0.45s ease-out;
    }

    @keyframes saved-flash {
      0% { background-color: var(--saved-wash); }
      100% { background-color: transparent; }
    }

    .task-card.saved-flash {
      animation: saved-flash 0.6s ease-out;
    }
    
    .task-card[data-status="In progress"] { border-left-color: var(--blue); background-color: var(--card-doing-bg); }
    .task-card[data-status="Done"] { border-left-color: var(--green); background-color: var(--card-done-bg); }
    .task-card[data-status="On schedule"] { border-left-color: var(--muted); }
    .task-card[data-status="My backlog"] { border-left-color: var(--purple); }
    
    .task-row {
      display: flex;
      align-items: center;
      min-height: var(--space-4);
      padding-right: var(--space-1);
    }

    .task-card.selected .task-row {
      height: auto;
      min-height: var(--space-4);
    }

    .drag-handle {
      width: var(--space-2);
      align-self: stretch;
      background-color: rgba(128, 128, 128, 0.05);
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 10px;
      border-right: 1px solid rgba(128, 128, 128, 0.2);
    }

    .drag-handle:hover {
      background-color: rgba(128, 128, 128, 0.1);
    }

    .story-type {
      width: var(--space-3);
      text-align: center;
      font-size: 14px;
    }
    
    .row-meta {
      display: flex;
      gap: var(--space-half);
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }

    .note-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface-subtle);
      border: 1px solid var(--border-soft-50);
      border-radius: 20px;
      padding: 2px 7px;
      white-space: nowrap;
      align-self: center;
    }

    .quick-note-btn {
      width: 24px;
      min-width: 24px;
      height: 24px;
      padding: 0;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      opacity: 0;
      transition: opacity var(--transition-fast), background var(--transition-fast);
    }

    .task-card:hover .quick-note-btn,
    .task-card.selected .quick-note-btn {
      opacity: 1;
    }

    .quick-note-btn:hover {
      background: rgba(0,0,0,0.05);
      color: var(--ink);
    }
    
    .task-text {
      flex: 1;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.4;
      font-size: 13px;
      cursor: pointer;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
      padding: 0 var(--space-1);
    }

    .task-card.selected .task-text {
      display: block;
      -webkit-line-clamp: unset;
      white-space: normal;
    }
    
    .task-text code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: var(--surface-subtle);
      color: var(--code-text);
      border-radius: 4px;
      padding: 2px 4px;
    }

    .story-menu {
      width: 24px;
      min-width: 24px;
      height: 24px;
      padding: 0;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: background var(--transition-fast);
    }
    
    .story-menu:hover {
      background: rgba(0,0,0,0.05);
      color: var(--ink);
    }
    
    .tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    
    .tag, .epic-chip {
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      cursor: pointer;
    }
    
    .tag.secondary {
      background: var(--surface-subtle);
      color: var(--muted);
      border: 1px solid var(--border-soft-50);
    }
    
    .epic-chip {
      color: #ffffff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: transform var(--transition-fast);
    }
    
    .epic-chip:hover {
      transform: scale(1.05);
    }
    
    .card-expanded {
      display: none;
      padding: var(--space-1) var(--space-2);
      border-top: 1px solid var(--border-soft);
      background: rgba(0, 0, 0, 0.05);
      margin: var(--space-1) 0 0 0;
    }
    
    .task-card.selected .card-expanded {
      display: block;
    }
    
    .card-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    
    .card-actions button, .card-actions select {
      height: 28px;
      min-height: 28px;
      font-size: 11px;
      padding: 0 8px;
      border-radius: 6px;
    }
    
    .compact-status-select {
      max-width: 90px;
      background: var(--surface-hover);
    }

    /* Launch split button + agent popover (prototype-launch-final) */
    .launch-split {
      display: inline-flex;
      position: relative;
    }

    .launch-split .launch-main,
    .launch-split .launch-caret {
      color: #fff;
      font-weight: 600;
      border: 1px solid var(--blue);
      background: var(--blue);
    }

    .launch-split .launch-main { border-radius: 6px 0 0 6px; }

    .launch-split .launch-caret {
      border-radius: 0 6px 6px 0;
      border-left: 1px solid rgba(255, 255, 255, 0.35);
      padding: 0 7px;
    }

    .launch-split.agent-claude .launch-main,
    .launch-split.agent-claude .launch-caret {
      background: var(--orange);
      border-color: var(--orange);
    }

    .launch-pop {

    /* Header preferences menu */
    .prefs-wrap, .data-wrap { position: relative; }

    #prefs-toggle, #data-toggle {

      border-radius: 6px;
      height: 26px;
      padding: 0 8px;

      color: var(--ink);

    #prefs-menu, #data-menu {
      position: absolute;
      top: 32px;
      right: 0;

    #data-status {

    /* Field stack (prototype-13): labeled fields inside the expanded card */
    .field-stack {
      display: grid;

    .field-stack label {
      display: block;

    .field-stack input[type="text"],

      border: 1px solid var(--line);

    .field-stack input[type="text"]:focus,

    .field-row {

    .epic-picker {

    .compact-editor {

    .inline-edit-wrap {

    .task-text.editing {
      display: block;

      overflow: visible;

      overflow-wrap: normal; /* UA gives [contenteditable] break-word; keep display-mode wrap points */

    .task-row .inline-edit-wrap {

    .tag-autocomplete {
      position: absolute;

    .tag-autocomplete > div .dot {

    /* Notes UI */
    .story-notes-thread {
      margin-top: 10px;

    .story-note-time {

    .story-note-form textarea {

      border-radius: 6px;

    .story-note-state {
      color: var(--muted);

      text-align: center;

    /* Epics pane */
    .epic-row {
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;

    .epic-row button {
      border: none;

    .focus-pane {

    #pane-toggles.focus-only {

    .epic-story-group-label {
      padding: 8px 14px;

      background: var(--card-bg);

    .epic-detail-metadata div {

    .epic-detail-metadata span {

    }
    
    .epic-detail-metadata strong {

    .epic-detail-activity {

    @keyframes pulse {
      0%, 100% { box-shadow: var(--shadow-sm); }
      35% { box-shadow: 0 0 0 4px rgba(52,199,89,.26), 0 0 0 9px rgba(52,199,89,.14); }
    }
    .highlight { animation: pulse 2.25s ease-in-out 2; }

    /* Menu button is mobile-only; hidden on desktop. */
    #mobile-menu { display: none; }

    @media (max-width: 760px) {
      /* --- Compact header: one control row + a swipe-tab strip --- */
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        row-gap: 10px;
        height: auto;
        padding: 10px 12px;
      }
      .logo { order: 1; font-size: 20px; }
      #global-search { order: 2; flex: 1 1 auto; min-width: 0; height: 38px; }
      #mobile-menu {
        order: 3;
        display: inline-flex;
        width: 42px;
        min-width: 42px;
        height: 38px;
        font-size: 17px;
      }

      /* Directory filter is unused on mobile. */
      #dir-filter-wrap { display: none; }

      /* Lane buttons become a horizontally-scrollable tab strip (row 2). */
      #pane-toggles {
        order: 4;
        flex: 1 1 100%;
        width: 100%;
        overflow-x: auto;
        flex-wrap: nowrap;
        gap: 6px;
        padding-bottom: 2px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      #pane-toggles::-webkit-scrollbar { display: none; }
      #pane-toggles button { flex: 0 0 auto; height: 34px; padding: 0 15px; }
      /* On mobile the pressed (visibility) state is irrelevant; only the
         in-view pane is highlighted via .is-active. */
      #pane-toggles button[aria-pressed="true"] {
        background: var(--surface-subtle);
        color: var(--muted);
      }
      #pane-toggles button.is-active {
        background: var(--strong-bg);
        color: #ffffff;
      }

      /* Secondary controls live behind the ☰ menu (revealed as row 3). */
      #portfolio-filter-wrap,
      #epic-filter-wrap,
      #status-bar,
      .portfolio-link,
      #theme-toggle,
      .data-wrap,
      .prefs-wrap { display: none; }
      header.menu-open #portfolio-filter-wrap,
      header.menu-open #epic-filter-wrap,
      header.menu-open #status-bar,
      header.menu-open .portfolio-link,
      header.menu-open #theme-toggle,
      header.menu-open .data-wrap,
      header.menu-open .prefs-wrap {
        display: flex;
        order: 5;
        flex: 1 1 100%;
        align-items: center;
      }
      header.menu-open #portfolio-filter-wrap select,
      header.menu-open #epic-filter-wrap select { width: 100%; }

      /* --- Board becomes a one-pane-at-a-time swipe carousel --- */
      .panes {
        height: calc(100dvh - 104px);
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        gap: 10px;
        padding: 10px;
      }
      .pane {
        flex: 0 0 100%;
        width: 100%;
        min-width: 100%;
        max-width: 100%;
        max-height: 100%;
        scroll-snap-align: start;
      }
      /* No per-pane close on mobile — panes are paged, not dismissed. */
      .pane-close { display: none; }
    }

    #theme-toggle {
      width: 34px;
      min-width: 34px;
      padding: 0;
      font-size: 15px;
    }

    .portfolio-link {
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 12.5px;

    #new-here-banner {

    @media (max-width: 720px) {

  <script>
