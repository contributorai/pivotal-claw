name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            cc/pivotal/requirements.txt
            cc/pivotal/requirements-postgres.txt
            cc/pivotal/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cc/pivotal/requirements.txt -r cc/pivotal/requirements-postgres.txt -r cc/pivotal/requirements-dev.txt
      - name: Test
        run: python -m pytest cc/pivotal/tests/
      - name: Check browser JavaScript syntax
        run: |
          for file in cc/todo/tree_viewer/*.js; do
            node --check "$file"
          done
      - name: Build and audit public package
        run: |
          python scripts/build_public_release.py "$RUNNER_TEMP/pivotal-claw-public"
          python scripts/audit_public_release.py "$RUNNER_TEMP/pivotal-claw-public"
